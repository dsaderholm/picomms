## Crewline: Bluetooth settings for WirePlumber >= 0.5 (Debian 13 / Raspberry Pi OS Trixie).
## Installed to /etc/wireplumber/wireplumber.conf.d/50-crewline.conf
## Settings below are DESIGN INTENT, to be confirmed on hardware (validation T1-T3).

wireplumber.settings = {
  ## An intercom is always a "call": never flip headsets to music (A2DP) and back.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  ## We are the Audio Gateway (the "phone"); headsets are the Hands-Free side.
  ## HFP only: HSP's call button triggers a profile switch in PipeWire
  ## (spa/plugins/bluez5/backend-native.c: AT+CKPD=200 -> switch_profile).
  ## Add hsp_ag only if the Cell2Jack proves to be HSP-only (test T4).
  bluez5.roles = [ hfp_ag ]
  bluez5.hfphsp-backend = "native"

  ## Wideband (mSBC) vs narrowband (CVSD). Which is better for RANGE (priority 1)
  ## and latency (priority 2) is a measurement (T7, T10), not an assumption.
  ## Set to false to force CVSD.
  bluez5.enable-msbc = true
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        ## Connect the hands-free profile as soon as a known headset appears.
        bluez5.auto-connect = [ hfp_hf ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.*" }
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        ## Never suspend a voice node: re-opening the voice link costs seconds
        ## of silence and clips the first words after a pause.
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]

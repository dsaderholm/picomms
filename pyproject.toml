[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewline"
version = "0.1.0"
description = "Local Bluetooth intercom appliance for stage/tech crews (prototype)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "dbus-fast>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
captions = ["faster-whisper>=1.0"]

[project.scripts]
crewline-engine = "crewline.engine:main"
crewline-web = "crewline.web.app:main"
crewline-caption-server = "crewline.captions.server:main"
crewline-probe = "crewline.tools.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crewline.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
